version: '3.8'

services:
  rail-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rail-notification-bot
    restart: always
    environment:
      - TZ=Asia/Jerusalem
      - PYTHONUNBUFFERED=1
    volumes:
      # Saved favourite stops, kept across rebuilds.
      - rail-data:/home/nonroot/app/data
    # אל תוסיף command: פה אם זה כותב משהו אחר!

volumes:
  rail-data:
